# Modified for Lumi Agents (https://github.com/RunLumi/LumiAgents) from ZCode (https://github.com/zai-org/ZCode). Apache-2.0 §4(b) modification notice.
name: DCO and licensing docs

# Lightweight, least-privilege checks for pull requests:
#   1. Every commit in the PR range carries a valid DCO 1.1 sign-off
#      (author identity; no exceptions beyond the recorded import base).
#   2. The licensing/contribution documents required by ADR 0001 exist
#      and contain their required anchors (perpetual grant, boundary).
#   3. Existing repo gates still run: license material check + Lumi
#      notice/drift checks on the merged result.
#
# Security posture: `contents: read` only; PR code is never executed
# during these checks (the scripts run are read from the merge commit
# of this repository itself, reviewed by maintainers). The existing
# macos-release.yml stays tag-triggered and is unaffected. These checks
# are enforced on PRs but branch protection is NOT configured by this
# workflow — enabling required status checks is an owner action
# (documented in docs/licensing/COMPLIANCE.md §9).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dco-license-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (merge commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check DCO sign-offs on PR commits
        if: github.event_name == 'pull_request'
        run: |
          node scripts/check-dco.mjs "origin/${{ github.base_ref }}..${{ github.sha }}"

      - name: Check DCO sign-offs on main push
        if: github.event_name == 'push'
        run: |
          # Import base per docs/licensing/COMPLIANCE.md §2; range excludes it.
          node scripts/check-dco.mjs "872ad960de7ec172591f7e1952f7849229f94521..${{ github.sha }}"

  licensing-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (merge commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Required licensing/contribution documents exist
        run: |
          for f in LICENSE LICENSING.md CONTRIBUTING.md TRADEMARKS.md \
                   docs/licensing/COMPLIANCE.md docs/licensing/MODIFICATIONS.md; do
            test -f "$f" || { echo "::error::missing required document: $f"; exit 1; }
          done

      - name: License anchors intact (perpetual grant, boundary, upstream)
        run: |
          grep -q "Apache License" LICENSE || \
            { echo "::error::LICENSE is not the Apache-2.0 text"; exit 1; }
          grep -q "Copyright 2026 Z.AI Co., Ltd" LICENSE || \
            { echo "::error::upstream copyright line was removed from LICENSE"; exit 1; }
          grep -q "perpetual" LICENSING.md || \
            { echo "::error::LICENSING.md lost the no-withdrawal explanation"; exit 1; }
          grep -q "Competitors may lawfully build" LICENSING.md || \
            { echo "::error::LICENSING.md lost the competition boundary statement"; exit 1; }
          grep -q "Developer Certificate of Origin" CONTRIBUTING.md || \
            { echo "::error::CONTRIBUTING.md lost the DCO"; exit 1; }
          grep -q "does not grant rights to the name" TRADEMARKS.md || \
            { echo "::error::TRADEMARKS.md lost the license/brand separation"; exit 1; }

  license-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (merge commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Third-party material gate (strict)
        run: node scripts/licenses.mjs check --strict

      - name: Modification notices
        run: node scripts/lumi-modified-files.mjs check

      - name: Branding/licensing drift
        run: node scripts/check-lumi-branding-drift.mjs
