# Modified for Lumi Agents (https://github.com/RunLumi/LumiAgents) from ZCode (https://github.com/zai-org/ZCode). Apache-2.0 §4(b) modification notice.
name: DCO and licensing docs

# Lightweight, least-privilege checks for pull requests:
#   1. Every commit in the PR range carries a valid DCO 1.1 sign-off
#      (author identity; no exceptions beyond the recorded import base).
#   2. The licensing/contribution documents required by ADR 0001 exist
#      and contain their required anchors (perpetual grant, boundary).
#   3. Existing repo gates still run: license material check + Lumi
#      notice/drift checks on the merged result.
#   4. Maintainer-credit tests preserve the original license and attribution.
#
# Security posture: merge-result scripts DO execute PR-supplied code.
# Use the unprivileged pull_request event, GitHub-hosted runners and
# contents: read only. No repository secrets are supplied here, and
# checkouts do not persist credentials. Do not change this to
# pull_request_target to run untrusted code with elevated permissions.
# The existing macos-release.yml stays tag-triggered and is unaffected.
# Branch protection is NOT configured by this workflow; enabling
# required checks is an owner action (docs/licensing/COMPLIANCE.md §9).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dco-license-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (merge commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check DCO sign-offs on PR commits
        if: github.event_name == 'pull_request'
        run: |
          node scripts/check-dco.mjs "origin/${{ github.base_ref }}..${{ github.sha }}"

      - name: Check DCO sign-offs on main push
        if: github.event_name == 'push'
        run: |
          # Import base per docs/licensing/COMPLIANCE.md §2; range excludes it.
          node scripts/check-dco.mjs "872ad960de7ec172591f7e1952f7849229f94521..${{ github.sha }}"

  licensing-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (merge commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Required licensing/contribution documents exist
        run: |
          for f in LICENSE LICENSING.md RIGHTS.md CONTRIBUTING.md TRADEMARKS.md \
                   docs/licensing/COMPLIANCE.md docs/licensing/MODIFICATIONS.md \
                   docs/licensing/dco-legacy-exceptions.json; do
            test -f "$f" || { echo "::error::missing required document: $f"; exit 1; }
          done

      - name: License anchors intact (perpetual grant, boundary, upstream)
        run: |
          grep -q "Apache License" LICENSE || \
            { echo "::error::LICENSE is not the Apache-2.0 text"; exit 1; }
          grep -q "Copyright 2026 Z.AI Co., Ltd" LICENSE || \
            { echo "::error::upstream copyright line was removed from LICENSE"; exit 1; }
          grep -q "perpetual" LICENSING.md || \
            { echo "::error::LICENSING.md lost the no-withdrawal explanation"; exit 1; }
          grep -q "Competitors may lawfully build" LICENSING.md || \
            { echo "::error::LICENSING.md lost the competition boundary statement"; exit 1; }
          grep -q "Developer Certificate of Origin" CONTRIBUTING.md || \
            { echo "::error::CONTRIBUTING.md lost the DCO"; exit 1; }
          grep -q "CLOUDJET SOLUTIONS PTE. LTD." RIGHTS.md || \
            { echo "::error::RIGHTS.md lost Cloudjet stewardship"; exit 1; }
          grep -q "Copyright 2026 Z.AI Co., Ltd" RIGHTS.md || \
            { echo "::error::RIGHTS.md lost upstream copyright boundary"; exit 1; }
          # Normalize formatting without weakening the copyright/trademark distinction.
          node -e 'const text = require("node:fs").readFileSync("TRADEMARKS.md", "utf8").replace(/\s+/g, " "); if (!text.includes("does **not**") || !text.includes("grant trademark permission") || !text.includes("does **not** retract copyright permissions")) process.exit(1)' || \
            { echo "::error::TRADEMARKS.md lost the copyright/trademark separation"; exit 1; }

  license-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (merge commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Attribution and dependency-graph regression tests
        run: >-
          node --experimental-strip-types --test
          scripts/lumi-maintainer-credit.test.mjs
          scripts/lumi-credits-access.test.mjs
          scripts/third-party-npm.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Licensing policy tests
        run: node --import tsx --test packages/ui/test/lumiLicensingPolicy.test.ts

      - name: Third-party material gate (strict)
        run: node scripts/licenses.mjs check --strict

      - name: Modification notices
        run: node scripts/lumi-modified-files.mjs check

      - name: Branding/licensing drift
        run: node scripts/check-lumi-branding-drift.mjs
