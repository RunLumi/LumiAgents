name: macOS release (signed + notarized)

# Fail-closed release pipeline for Lumi Agents:
#   build -> sign -> notarize -> staple -> SIGNING GATE -> upload -> publish.
# Artifacts are never uploaded or released unless the gate passes. If signing
# secrets are missing, the pipeline fails instead of shipping an unsigned build.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   MACOS_CERT_P12               base64 of the Developer ID Application .p12
#   MACOS_CERT_PASSWORD          password for that .p12
#   MACOS_SIGNING_IDENTITY       "Developer ID Application: <Name> (<TEAMID>)"
#   APPLE_API_KEY_P8             App Store Connect API private key contents
#   APPLE_API_KEY_ID             App Store Connect API key id
#   APPLE_API_ISSUER             App Store Connect issuer UUID
#   APPLE_TEAM_ID                Apple Developer team id (also checked by the gate)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-sign-notarize:
    name: Build, sign, notarize, verify (macOS arm64)
    # macos-14 runners are Apple Silicon (arm64), matching the target arch below.
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ZCODE_ENV: production
      ZCODE_TARGET_OS: mac
      ZCODE_TARGET_ARCH: arm64
      ZCODE_ENABLE_MAC_SIGN: "1"
      # electron-builder imports CSC_LINK into a temporary keychain and signs with it.
      CSC_LINK: ${{ secrets.MACOS_CERT_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      # Notarization uses the App Store Connect API key materialized below.
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      # Fail before doing any work so missing credentials can never produce an unsigned release.
      - name: Require signing secrets
        run: |
          : "${CSC_LINK:?MACOS_CERT_P12 secret is required}"
          : "${CSC_KEY_PASSWORD:?MACOS_CERT_PASSWORD secret is required}"
          : "${APPLE_SIGNING_IDENTITY:?MACOS_SIGNING_IDENTITY secret is required}"
          : "${APPLE_API_KEY_P8:?APPLE_API_KEY_P8 secret is required}"
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID secret is required}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID secret is required}"

      - name: Materialize App Store Connect API key
        run: |
          umask 077
          APPLE_API_KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" > "${APPLE_API_KEY_PATH}"
          printf 'APPLE_API_KEY=%s\n' "${APPLE_API_KEY_PATH}" >> "${GITHUB_ENV}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint
        run: |
          pnpm typecheck
          pnpm lint

      # bundle.mjs runs notarization and the gate automatically when signing is enabled.
      - name: Build, sign, notarize
        run: pnpm bundle:desktop -- --os mac --arch arm64

      # Redundant with the in-build gate on purpose: gives an explicit, greppable CI signal
      # and re-checks the exact artifacts this job is about to upload.
      - name: Run macOS signing gate
        run: |
          APP="packages/desktop/dist/mac-arm64/Lumi Agents.app"
          DMG="$(ls packages/desktop/dist/*.dmg | head -n 1)"
          pnpm verify:macos-release-signing -- --app "$APP" --artifact "$DMG" --require-staple

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumi-agents-macos-arm64
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build-sign-notarize
    # Runs only for tag pushes, so a manual dispatch verifies without publishing.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: lumi-agents-macos-arm64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Lumi Agents ${GITHUB_REF_NAME}" \
            --generate-notes
