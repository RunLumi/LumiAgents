# Modified for Lumi Agents (https://github.com/RunLumi/LumiAgents) from ZCode (https://github.com/zai-org/ZCode). Apache-2.0 §4(b) modification notice.
name: Linux release

# Linux release pipeline:
#   build -> validate -> upload -> publish.
# Linux artifacts are intentionally unsigned; signing is not part of this
# workflow's release contract.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ZCODE_ENV: production
      ZCODE_TARGET_OS: linux
      ZCODE_TARGET_ARCH: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Build Linux desktop artifacts
        run: pnpm bundle:desktop -- --os linux --arch x64

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumi-agents-linux-x64
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    # Manual dispatch verifies the pipeline without publishing anything.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: lumi-agents-linux-x64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Lumi Agents ${GITHUB_REF_NAME}" \
            --generate-notes
